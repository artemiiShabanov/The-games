# Единый источник плана The Games. Из него генерируются docs/PLAN.md и метки/вехи/issues на GitHub:
#   python3 tools/sync_plan.py            # обновить PLAN.md
#   python3 tools/sync_plan.py --github   # плюс создать метки, вехи и issues (идемпотентно)
#
# size: S = полдня, M = день, L = два дня, XL = три дня
# Задачи атомарны. Issue закрываются на GitHub; done: true здесь только для уже закрытых при миграции.

project: "The Games"
labels:
  types:
    "type: code":     {color: "1d76db", desc: "Геймплей, системы, инструменты"}
    "type: 3d":       {color: "8e44ad", desc: "Модели, риги, анимации, сцены"}
    "type: design":   {color: "0e8a16", desc: "Контент, баланс, правила"}
    "type: vfx":      {color: "f39c12", desc: "Частицы, шейдеры, свет, пост-обработка"}
    "type: ui":       {color: "e91e63", desc: "HUD, меню, экраны"}
    "type: audio":    {color: "1abc9c", desc: "Звук и музыка"}
    "type: art":      {color: "fbca04", desc: "2D-арт: иконки, капсула, текстуры"}
    "type: release":  {color: "5a5a5a", desc: "Сборки, магазины, инфраструктура"}
  sizes:
    "size: S":  {color: "c5def5", desc: "Полдня"}
    "size: M":  {color: "9ec5e8", desc: "День"}
    "size: L":  {color: "6fa8dc", desc: "Два дня"}
    "size: XL": {color: "3d85c6", desc: "Три дня"}
  owners:
    "owner: artemii": {color: "c2e0c6", desc: "Делает Артемий"}
    "owner: claude":  {color: "bfd4f2", desc: "Делает Claude"}
    "owner: both":    {color: "e6d7f5", desc: "Совместно"}
  status:
    "status: needs decision": {color: "b60205", desc: "Нужно решение Артемия по дизайну"}
    "status: in progress":    {color: "fef2c0", desc: "В работе"}
    "status: blocked":        {color: "d93f0b", desc: "Заблокировано"}
    "status: needs playtest": {color: "d4c5f9", desc: "Готово, ждёт проверки в игре"}

phases:
  - id: M0
    title: "M0 Прототип"
    goal: "Ответить на главный вопрос GDD: чувствует ли игрок связь «я провалил мини-игру, и вот в моей демке именно этот баг»: провалил «Прыгай», герой прыгает выше экрана; провалил «Подгони», демка дёргается."
    done_when: "Один жанр, одна технология, четыре аспектные мини-игры плюс жанровая, одна демка с пятью багами, ноль экономики; играется 5 минут без заглушек; автотест есть."
    status: done
    issues:
      - title: "Скаффолд: автотест, базовая сцена, структура папок"
        types: [code]
        owner: claude
        size: S
        body: "Пустая главная сцена, `--auto-test --screenshot=` прогоняет N кадров ботом, пишет скриншот и печатает `END ok`. Структура `scenes/ scripts/ resources/ assets/ debug/scenes/ debug/playtest/`."
      - title: "Дебаг-меню: каркас, реестр ручек, запуск тестовых сцен"
        types: [code]
        owner: claude
        size: M
        body: "По `specs/debug.md`: автолоад `Debug` с `add_action / add_toggle / add_number / add_choice / watch`, окно с разделами на F1, `--debug`, `--scene=<id>`, сканирование `debug/scenes/`, переключатели v1 (бот выигрывает или проигрывает, скорость времени, FPS, без звука, пропуск карточек), горячие клавиши F2, F3, F5, F9, `user://debug.cfg`, исключение из экспорта. Разделы мини-игр, демок и состояния добавляют их задачи."
      - title: "Ввод: действия влево, вправо, вверх, вниз, A, B для клавиатуры и геймпада"
        types: [code]
        owner: claude
        size: S
        body: "InputMap по спеке мини-игр: A = Z, пробел, Enter, кнопка юга; B = X, Esc, кнопка востока; стрелки = крестовина и левый стик. Один хелпер `GameInput` для мини-игр и демок."
      - title: "Стиль оболочки: токены Style и тема окна по STYLE.md"
        types: [ui]
        owner: claude
        size: S
        body: "Единая точка визуального кода в Godot: `scripts/ui/style.gd` с цветами, размерами шрифта, радиусами, отступами и геометрией из `STYLE.md`, фабрики стилей (`flat`, `focus_ring`, `card`), тема оболочки `Style.make_theme()` на корневом окне через автолоад `UiTheme`. Дебаг-меню, тестовые сцены и главная сцена без своих литералов цвета. Окно 1920×1080."
      - title: "MinigameDef, SprintTuning и подбор набора спринтов как чистая функция"
        types: [code]
        owner: claude
        size: M
        body: "Ресурсы по `specs/minigames.md`: `MinigameDef` (kind, aspect, owner, verb, hint, scene, inputs), `SprintTuning` с весами аспектов. Подбор для N = 4, 5, 8 с тестом в автотесте; в M0 без технологической мини-игры."
      - title: "Раннер спринта: интро, мини-игра, результат, сигналы"
        types: [code, ui]
        owner: claude
        size: M
        body: "Карточка-интро с глаголом и значком, сцена мини-игры, карточка результата «готово» или штамп бага, пауза под анимацию студии (в M0 заглушка-цвет), пропуск любой клавишей. Вид по концептам `02a`, `03a`, `03b`. Сигналы `sprint_started`, `sprint_finished`. Раздел «Мини-игры» в дебаг-меню: любая `MinigameDef`, `t`, сид, зациклить. Тестовая сцена `sprint_runner_test`: 8 спринтов ботом, она же автотест."
      - title: "Мини-игра «Подгони» (fit_frame, оптимизация)"
        types: [code]
        owner: claude
        size: L
        body: "Тарелка с мутной жидкостью, многоугольники 3-8 сторон двух цветов всплывают из размытия, два трафарета, стрелки влево и вправо меняют число сторон, вверх и вниз отправляют. 6-8 фигур за 20 с, провал при двух непопавших. Кривые от `t` в `resources/minigames/fit_frame.tres`."
      - title: "Мини-игра «В такт» (in_time, звук)"
        types: [code, audio]
        owner: claude
        size: M
        body: "Три дорожки влево, вниз, вправо, ноты бегут к метке, длинные ноты зажимаются. 16 нот за 20 с, провал при менее чем 11 попаданиях. Метроном и звук попадания синхронны с нотами."
      - title: "Мини-игра «Повтори» (repeat, управление)"
        types: [code]
        owner: claude
        size: S
        body: "Последовательность 4-7 клавиш показывается, повторить до таймера, 4 раунда, провал при двух ошибках. Ложные вспышки с ростом `t`."
      - title: "Мини-игра «Залей» (flood_fill, графика)"
        types: [code]
        owner: claude
        size: M
        body: "Сетка крупных пикселей трёх-четырёх цветов, палитра внизу, A заливает из левого верхнего угла. Две картинки за 30 с, первая в пару заливок. Провал: кончились ходы или время. Генератор картинок с гарантированным решением в запас ходов."
      - title: "Мини-игра «Прыгай» (runner, платформер)"
        types: [code]
        owner: claude
        size: M
        body: "Точка бежит сама, A прыжок, ямы и столбики, 20 с, провал при двух падениях. С `t` двойные ямы и столбики подряд. Абстрактный вид в стиле оболочки, без ассетов демки."
      - title: "GameRecord, BugCatalog, BugDef и пять багов M0"
        types: [code, design]
        owner: claude
        size: M
        body: "`GameRecord` с конфигурацией, `seed` и `bug_ids`; `BugCatalog` в `resources/bugs/catalog.tres`. Шесть багов M0: кадры проседают, музыка заикается, кнопка залипает, розовые заглушки, платформы с монетами не достать, дикая физика прыжка. У каждого id, класс, название для штампа, текст проявления. Провал спринта кладёт баг аспекта или жанра в запись."
      - title: "Спрайты платформера 8-bit: герой, враг, монета, флаг, тайлы, одна палитра"
        types: [art]
        owner: claude
        size: S
        body: "Тайлы 16×16, герой с тремя кадрами бега и прыжком, враг-ходок два кадра, монета, чекпоинт, флаг, земля и платформа. Палитра из 4 цветов плюс чёрный, сеттинг один, нужны настоящие спрайты, чтобы баг графики с розовыми заглушками читался."
      - title: "Генератор уровня платформера 8-bit из сида"
        types: [code]
        owner: claude
        size: M
        body: "Из `seed` раскладка на минуту бега: ямы, платформы, враги-ходоки, монеты, чекпоинт, флаг. Детерминирован, проходим без багов. Тестовая сцена `level_gen_test`: сто уровней из сидов рядом с картой проходимости, она же проверка в автотесте."
      - title: "Демка платформер × 8-bit: герой, враги, монеты, таймер, экран итога"
        types: [code]
        owner: claude
        size: L
        body: "Прыжок с переменной высотой по длине нажатия, враг-ходок, монеты, чекпоинт, таймер 60 с на экране, флаг. Экран итога «добежал» или «не добежал» и возврат туда, откуда запустили. Сигналы `demo_started`, `demo_finished`. Esc выход, пауза. Раздел «Демки» в дебаг-меню: сид, галочки багов, запуск."
      - title: "Аспектные баги в демке: фризы, заикание музыки, залипание кнопки, розовые заглушки"
        types: [code]
        owner: claude
        size: M
        body: "Баги включаются флагами из `GameRecord`. Фризы 200-400 мс в движении, заикание и задержка звука, залипание прыжка и ввод с опозданием, часть спрайтов розовыми квадратами. Параметры в `resources/bugs/<id>.tres`. Каждый виден в первые 15 секунд."
      - title: "Баг жанра: герой проваливается сквозь часть платформ"
        types: [code]
        owner: claude
        size: S
        body: "Часть платформ по сиду теряет коллизию; визуально ничем не отличаются. Зрелищный баг: флаг `spectacular` в каталоге."
      - title: "Звук демки: чиптюн-петля и звуки прыжка, монеты, удара, финиша"
        types: [audio]
        owner: claude
        size: S
        body: "Трёхголосый чиптюн на одну минуту и 4-6 звуков. Нужны, чтобы баг звука был слышен. Сгенерированные, заглушка до M5."
      - title: "Звук оболочки M0: интро, результат, попадание и промах мини-игр"
        types: [audio]
        owner: claude
        size: S
        body: "Короткие синтетические звуки в стиле оболочки, без чиптюна: карточка интро, «готово», штамп бага, попадание и промах, общие для четырёх мини-игр."
      - title: "Петля M0: пять спринтов, плейтест демки, итог релиза, снова"
        types: [code, ui]
        owner: claude
        size: M
        body: "Без экономики: старт → 5 спринтов по подбору → плейтест демки с набранными багами → экран итога с списком багов и штампами → новый релиз с `t` на шаг больше. В дебаг-меню раздел «Состояние»: номер релиза, `t`, текущая запись игры."
      - title: "Плейтест M0: ответ на главный вопрос GDD"
        types: [design]
        owner: artemii
        size: S
        body: "Сыграть 3-4 релиза подряд. Записать в `DESIGN.md`: чувствуется ли связь «провалил мини-игру, вот этот баг в демке», какие баги читаются, какие нет, что резать и менять перед M1."
  - id: M1
    title: "M1 Петля"
    goal: "Замкнуть петлю релиза на одной паре: конструктор, десять аспектных мини-игр, плейтест и багфикс, лента с формулами успеха, фаза студии с деньгами, содержанием и прокачкой. Заглушечный арт."
    done_when: "Три релиза подряд играются 15-20 минут, хвосты тикают, деньги кончаются или копятся осмысленно."
    status: done
    issues:
      - title: "Экономика: EconomyTuning, Wallet, Upkeep, цена спринта и стоимость релиза"
        types: [code]
        owner: claude
        size: M
        body: "По `specs/economy.md`: `resources/economy.tres` с числами из `economy_model.md`, `Wallet` (`cash`, сигнал `money_changed`), `Upkeep` (база плюс надбавки прокачек), цена спринта = база технологии × множитель жанра × множитель сеттинга с округлением до 10, стоимость релиза = спринты × цена. Чистые функции, тестовая сцена `economy_test` сверяет таблицу из модели. Проверка банкротства как функция от кошелька и открытых пар."
      - title: "Конструктор: GameConfig, каталоги, смета, экран с каруселями и названием"
        types: [code, ui]
        owner: claude
        size: L
        body: "По `specs/constructor.md`: `GameConfig`, `ConstructorTuning`, каталоги `genres/techs/settings.tres` (в M1 одна пара и один сеттинг, остальные карточки затемнены с подписью «придёт с прокачкой»), смета как чистая функция, экран с тремя каруселями (`CARD_SIZE`, фокус по STYLE), строка сметы красная при нехватке, генератор названий из тегов, кнопка «в разработку» списывает деньги. Дебаг: принудительная конфигурация без экрана."
      - title: "Сиквелы и ремейки в конструкторе: переключатель, список прошлых игр, локи, нумерация"
        types: [code, ui]
        owner: claude
        size: M
        body: "Флаги `sequels_unlocked`, `remakes_unlocked` из студии. Переключатель «новая / сиквел / ремейк» над каруселями, список прошлых игр забега, сиквел лочит жанр и сеттинг и добавляет номер, ремейк требует другую технологию (в M1 при одной технологии ремейк недоступен с подписью). `GameRecord` получает `parent` и номер части для формул успеха."
      - title: "Успех: SuccessTuning, MarketState, расчёт критиков, продаж, стримеров, хвоста и репутации"
        types: [code, design]
        owner: claude
        size: L
        body: "По `specs/success.md` и `success_model.md`: `ReleaseScore`, `MarketState` (спрос, тренд, насыщение, синергия с шумом забега, репутация, настрой рынка), чистые функции критиков, первого тика продаж, охвата стримеров и порога «вирусно», распад хвоста и его отключение, обновление репутации, насыщения и тренда после релиза, итоги для концовок и оценка студии. Тестовая сцена `success_test` сверяет модельный забег с таблицей из спеки."
      - title: "Лента отклика: твиты, карточки критиков, клип стримера, цифры, «В демо» и «Дальше»"
        types: [ui, code]
        owner: claude
        size: L
        body: "Экран по `specs/success.md` и STYLE (колонка 880): два твита, три карточки постоянных критиков со сдвигами, клип стримера с кадром самого зрелищного бага (скриншот демки с подписью, заглушка), ещё два твита, карточка цифр, кнопки. Шаблоны текстов в `resources/texts/feed.tres` черновые с подстановкой бага, жанра, сеттинга и тона от знака показателя. Лица критиков и стримеров заглушки (буква в круге), `resources/people/*.tres`."
      - title: "Спринт багфикса после плейтеста"
        types: [code, ui]
        owner: claude
        size: M
        body: "По `specs/demos.md`: после демки карточка с предложением купить спринт багфикса по цене обычного спринта (с множителем из экономики), Esc отказ. Согласие списывает деньги и запускает случайную аспектную мини-игру через `SprintRunner`; успех чинит половину текущих багов с округлением вверх, случайно какие, провал ничего не добавляет. Возможность «Отдел QA» даёт второе предложение."
      - title: "Фаза студии: тики хвостов, содержание, банкротство, оценка, предложение прокачки"
        types: [code, ui]
        owner: claude
        size: L
        body: "По `specs/studio.md` шаги 1-6 с короткими анимациями: прокрутка денег за 240 мс, строка содержания, проверка банкротства (в M1 без вставки спасения: второй раз подряд нет денег на дешёвый релиз, экран конца забега; спасение приходит в M2 с метой), оценка студии рядом с деньгами, карточка «Что улучшим?» с тремя вариантами по правилу состава, недоступное красным с нехваткой, Esc отказ. Пул `resources/upgrades/*.tres` v1: семь возможностей из спеки («новый сеттинг» ждёт M2), технологии и жанры появятся с их вехами. Студия на фоне остаётся цветом, предметы и человечки в M5."
      - title: "Эффекты возможностей: переигровка, вторая переигровка, QA, инсайдер, менеджер"
        types: [code]
        owner: claude
        size: M
        body: "Переигровка: после провала спринта предложение сыграть ещё раз, одна или две на релиз в зависимости от купленного (`SprintRunner.replays`). QA: второй спринт багфикса. Инсайдер: метка «в тренде» на карточках конструктора. Менеджер: цена спринта −10 % в смете и списании. Сиквелы и ремейки открывают переключатель конструктора. Все эффекты через `StudioState.has(id)`, без разбросанных флагов."
      - title: "Петля M1: конструктор → спринты → плейтест и багфикс → лента → студия → конструктор"
        types: [code]
        owner: claude
        size: L
        body: "`RunState` (номер релиза, записи, рынок, кошелёк, студия) в памяти, без слотов и сохранений (M2). Главная сцена проходит все фазы: первый релиз на стартовой паре без конструктора, дальше через него; номер релиза в углу; переход в демо из ленты и обратно; конец забега по банкротству с коротким экраном и возвратом на старт. Бот под `--loop` проходит три релиза и проверяет, что деньги и хвосты сходятся с чистыми функциями. Раздел «Состояние» дебаг-меню: правка денег, номера релиза, репутации, принудительная покупка прокачки."
      - title: "Мини-игра «Поправь» (patch_line, оптимизация)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: лента крупных блоков бежит справа налево, курсор стоит, A меняет блок под курсором на правильный, провал по числу пропущенных. Кривые от `t` в ресурсе, бот WIN и LOSE, автотест. Баг при провале из аспекта оптимизации."
      - title: "Мини-игра «Настрой волну» (tune, звук)"
        types: [code, audio]
        owner: claude
        size: M
        body: "По каталогу: две волны наложены, эталон и своя; стрелки меняют частоту и амплитуду, звук синтезируется из своей волны и биения слышны. Совпасть с допуском до таймера. Кривые от `t`, бот, автотест."
      - title: "Мини-игра «Выведи» (inverted, управление)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: лабиринт 5×5, точка в центре, выход в углу; нечётный лабиринт стрелки двигают точку, чётный двигают сам лабиринт под неподвижной точкой; стены не пускают. 2-3 лабиринта за 20 с, с `t` режимы меняются чаще. Генератор лабиринтов по сиду, бот, автотест."
      - title: "Мини-игра «Наведи» (beam, графика)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: луч из платформы, ряд зеркал, мишень; влево и вправо наклоняют текущее зеркало, луч перерисовывается в реальном времени, A передаёт управление следующему зеркалу, когда луч в него попал. С `t` мишень движется и последнее зеркало призма. Бот, автотест."
      - title: "Мини-игра «Реши» (decide_cards, баланс)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: карточки едут слева направо с числом, цветом или многоугольником, правило вверху пиктограммой; A принять, B отклонить, 8 карточек за 20 с, провал при двух ошибках. С `t` правило из двух условий и смена правила посреди раунда. Бот, автотест."
      - title: "Мини-игра «Удержи» (fishing, баланс)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: вертикальная дорожка, шарик скачет по своей кривой, столбик игрока поднимается при зажатой клавише и падает при отпущенной; шкала растёт, пока шарик внутри. Заполнить шкалу за 20 с. С `t` шарик резче и столбик уже. Бот, автотест."
      - title: "Мини-игра «Запомни» (pairs, 8-bit) и баг технологии 8-bit в демке"
        types: [code]
        owner: claude
        size: M
        body: "Технологическая мини-игра пары M1, чтобы план релиза всегда содержал мини-игру технологии: сетка 3×4 закрытых карточек с пиктограммами, курсор стрелками, A открывает, 6 пар за 25 с, с `t` сетка 4×4. Провал даёт баг технологии 8-bit в платформере: спрайты мерцают и исчезают при четырёх на строке (`BugDef` с параметрами). Планировщик перестаёт пропускать технологическую мини-игру."
      - title: "Вторые аспектные баги: чужая палитра, враги бессмертны или умирают от чиха"
        types: [code, design]
        owner: claude
        size: M
        body: "По `specs/demos.md` второй баг для графики (чужая палитра: спрайты демки в палитре другого сеттинга) и баланса (враги бессмертны или умирают от чиха: добивание не работает или враги гибнут от касания), чтобы у каждого аспекта было по два проявления и два провала одного аспекта не давали один баг дважды. `BugCatalog.pick_new` с весами, тексты твитов и подписи клипов черновые."
      - title: "Симулятор экономики и успеха в согласии с тюнингом"
        types: [code, design]
        owner: claude
        size: S
        body: "`tools/model_run.py` читает числа из `economy.tres` и `success.tres` (или общий JSON, из которого генерируются оба), прогоняет модельные забеги из `economy_model.md`; тест, что забег хороших рук не уходит в минус, а забег плохих банкротится к 6-8 релизу. Запуск в CI-скрипте рядом с автотестом."
      - title: "Плейтест M1: три релиза подряд"
        types: [design]
        owner: artemii
        size: S
        body: "Сыграть три релиза подряд. Вопросы вехи: играется ли 15-20 минут без провисаний, тикают ли хвосты понятно, кончаются ли деньги осмысленно или копятся, читается ли лента как отклик на свои решения и баги. Замечания в issues, решения в журнал."
      - title: "Ввод: B без Esc, подписи реальными клавишами"
        types: [code, ui]
        owner: claude
        size: S
        body: "По плейтесту M1 (решение 2026-11-08): действие B на Ctrl, X и C, Esc только паузы и отказы оболочки. Подписи в пилюлях и подсказках вместо «A»/«B» реальные клавиши («␣», «Ctrl») через `GameInput.key(action)`; с геймпадом та же функция отдаёт его кнопки. Проверить все экраны, где подсказки набраны строкой."
      - title: "Пауза в мини-играх на Esc с правилами"
        types: [code, ui]
        owner: claude
        size: S
        body: "По плейтесту M1 (решение 2026-11-08): Esc во время мини-игры ставит таймер и ввод на паузу, поверх поля затемнение с карточкой: глагол, правила мини-игры (`MinigameDef.hint`), пилюля ввода, кнопка «Продолжить» (␣, Esc, клик). Под ботом паузы нет. Спеки мини-игр и забега поправить."
      - title: "Мышь в оболочке: колесо и клики"
        types: [code, ui]
        owner: claude
        size: M
        body: "По плейтесту M1 (решение 2026-11-08): во всех экранах оболочки колесо листает (карусели конструктора и основы, лента, карточки студии), клик по карточке выбирает её, клик по кнопке нажимает, клик по карточке интро или результата равен любой клавише, в паузе демки и мини-игры клик по пункту. Ховера нет, фокус переезжает по клику. Мини-игры остаются клавиатурными."
  - id: M2
    title: "M2 Первый забег"
    goal: "Все пять жанров на 8-bit, случайный старт, три сеттинга, мета-вставки со спасением и концовками, кап, итоги года, галерея, три слота."
    done_when: "Полный забег 1-2 часа от старта до концовки на одной технологии; симулятор экономики сходится с реальным забегом."
    status: done
    issues:
      - title: "Мармелад: интерфейс оболочки"
        types: [ui, code]
        owner: claude
        size: L
        body: "По прототипу 2026-11-09 (`STYLE.md` «Мармелад»): общий слой искажения `JellyUi` и толщина `JellyLift` в фабриках `CardFrame`, `HintPill`, `CardColumns`, `Jelly.button`, `Jelly.panel`. Все экраны оболочки: элементы отстают и гнутся при рывке, пружинят, вминаются под курсором; фокус толщиной вместо синей рамки; теней нет, карточку экрана отделяет толщина, внутренние карточки `surface-2`; жирный скруглённый шрифт темой. Раздел «Желе» дебаг-меню: выключатель движения, материал, ручки."
      - title: "Мармелад: мини-игры"
        types: [code, ui]
        owner: claude
        size: XL
        body: "Остальные мини-игры по образцу «Прыгай» и «Подгони» (`STYLE.md` «Мармелад»): подвижные объекты мягкими телами (`SoftBlob`, `SoftOutline`), поверхности с волнами, брызги и след, предметы на пружинах; синяя рамка выделения внутри мини-игр заменяется толщиной или вмятиной. По одной мини-игре за шаг, бот WIN и LOSE зелёные, лист кадров `jelly_test` в issue. Общий обвес (таймер, значок, пилюля) тоже мармеладный."
      - title: "Открытый скруглённый шрифт вместо системного"
        types: [ui]
        owner: claude
        size: S
        body: "Сейчас тема берёт системный SF Pro Rounded (только macOS, класть в сборку нельзя), без него встроенный шрифт с искусственной жирностью. Выбрать открытый скруглённый гротеск с кириллицей и переменной жирностью (кандидаты Nunito, Rubik), положить в `assets/fonts/` с лицензией, `Jelly.fun_font` берёт его. Моноширинный жирный тоже открытый. Сравнить скриншоты конструктора и ленты."
      - title: "Общие баги демок в базовом классе, проявления по жанру"
        types: [code]
        owner: claude
        size: M
        body: "До новых демок: фризы, заикание звука, ввод с опозданием и залипанием, розовые заглушки и чужая палитра переезжают из платформера в `Demo` (или общий помощник) и работают в любой демке по слотам спрайтов. `BugDef` получает проявление, твит и кадр клипа по жанру, балансные баги (`unreachable_coins`, `sneeze_enemies`) остаются жанровыми проявлениями: у каждой демки свой вариант «цель недостижима» и «враги от чиха». Платформер переходит на общий код без изменения поведения, `demo_test --bugs` зелёный."
      - title: "Демки по паре в петле и ленте, жанры в пуле прокачки"
        types: [code]
        owner: claude
        size: M
        body: "Каталог сцен демок по жанру и технологии вместо зашитого платформера: плейтест, «В демо» из ленты и стрим ленты берут демку записи. Четыре жанра как `UpgradeDef` вида GENRE (цена и надбавка из `economy.tres`), жанровая мини-игра попадает в план релиза. Ремейки вне пула, пока открыта одна технология. Пара без готовой демки в карусели закрыта с подписью «демка в работе», чтобы петля не ломалась, пока демки приходят по одной."
      - title: "Сеттинги в демках: ассеты, палитра и слова по записи"
        types: [code]
        owner: claude
        size: M
        body: "Три сеттинга открыты со старта забега (`specs/run.md`), карусель сеттингов из трёх карточек. Демка грузит спрайты и палитру сеттинга записи из `assets/settings/<сеттинг>/8bit/` по слотам `demos_catalog.md`, фон и слова (существительные, хэштег) из ресурса сеттинга. Платформер на трёх сеттингах, генератор названий и лента уже их знают."
      - title: "Спрайты 8-bit космоса и замков для платформера"
        types: [art, code]
        owner: claude
        size: M
        body: "`tools/pixel_sprites.py` пишет наборы по сеттингам: палитра из 4 цветов плюс чёрный и все слоты платформера (герой, ходок, летун, монета, флаг, чекпоинт, земля, платформа, облака) для космоса и замков. Заглушечный арт до M5, но читаемый: силуэты отличаются от пиратов. Превью-лист в `debug/playtest/`."
      - title: "Демка гонки × 8-bit"
        types: [code]
        owner: claude
        size: XL
        body: "По `demos_catalog.md`: вид сверху, прокрутка за машиной, спрайт в 8 направлениях, обочина замедляет, один круг против трёх ботов; влево, вправо, ␣ газ, Ctrl тормоз. Трасса из сида с проверкой замкнутости и ширины, тюнинг в `resources/demos/`, бот WIN и LOSE, итог «добрался первым / не добрался», тестовая сцена или флаг `demo_test --genre=racing`. Спрайты пиратов."
      - title: "Баги в демке гонок"
        types: [code, design]
        owner: claude
        size: M
        body: "Жанровый баг гонок: машина проходит сквозь стены и вылетает с трассы (новый `BugDef`, проявление видно в первые 15 секунд). Балансные проявления аспектов для гонок: цель недостижима или тривиальна, соперники от чиха (боты сходят с трассы от касания). Общие баги из базового класса работают. Тексты твитов и клипов черновые."
      - title: "Демка шутер × 8-bit"
        types: [code]
        owner: claude
        size: XL
        body: "По `demos_catalog.md`: вид сверху, арена в один экран, враги двух типов (идёт и стреляет), аптечка раз в 20 секунд, уничтожить 30; стрелки, ␣ выстрел, Ctrl смена направления на месте. Волны из сида, тюнинг в ресурсе, бот WIN и LOSE, итог, запуск из `demo_test`. Спрайты пиратов."
      - title: "Баги в демке шутера"
        types: [code, design]
        owner: claude
        size: M
        body: "Жанровый баг шутера: пули проходят сквозь врагов, попадания не засчитываются через раз. Балансные проявления: враги от чиха, цель недостижима (лишние враги без конца волны). Общие баги работают. Тексты черновые."
      - title: "Демка спорт × 8-bit: гольф"
        types: [code]
        owner: claude
        size: L
        body: "По `demos_catalog.md`: гольф вид сбоку, шкала силы и угла, ветер, две-три лунки за минуту, меньше ударов лучше; ␣ зажать и отпустить, вверх и вниз угол. Рельеф лунок из сида, тюнинг в ресурсе, бот WIN и LOSE, итог по ударам против пара, запуск из `demo_test`. Спрайты пиратов (мяч бочонок, лунка люк)."
      - title: "Баги в демке гольфа"
        types: [code, design]
        owner: claude
        size: M
        body: "Жанровый баг спорта: мяч залипает в рельефе или улетает за край поля. Балансные проявления: лунка недостижима (на вершине без подхода) или тривиальна (мяч сам скатывается), ветер от чиха. Общие баги работают. Тексты черновые."
      - title: "Демка файтинг × 8-bit"
        types: [code]
        owner: claude
        size: XL
        body: "По `demos_catalog.md`: вид сбоку, один на один против бота, бойцы 16×32, удар верхний и нижний, блок стоя, присед; влево, вправо, ␣ удар, Ctrl блок, вниз присед. Больше здоровья через минуту. Бот соперника с паттернами из сида, бот игрока WIN и LOSE для автотеста, итог, запуск из `demo_test`. Спрайты пиратов (матрос против капитана)."
      - title: "Баги в демке файтинга"
        types: [code, design]
        owner: claude
        size: M
        body: "Жанровый баг файтинга: удары не регистрируются, хитбоксы смещены. Балансные проявления: соперник падает от чиха или не теряет здоровья. Общие баги работают. Тексты черновые."
      - title: "Мини-игра «Старт» (lights_out, гонки)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: пять огней зажигаются по одному, в случайный момент гаснут, ␣ как можно быстрее; раньше фальстарт. 5 раундов, провал при 2 фальстартах или 2 медленных. Кривые от `t` (разброс паузы, ложные мигания), бот WIN и LOSE, правила на паузе, автотест."
      - title: "Мини-игра «Бей» (mole, шутер)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: четыре лунки по сторонам, кружки выскакивают и прячутся, нужная стрелка бьёт, пока кружок снаружи; 20 с, провал при 5 упущенных. Кривые от `t` (темп, два кружка сразу), бот, автотест."
      - title: "Мини-игра «Натяни» (putt, спорт)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: зажать ␣, шкала силы растёт, отпустить, шар летит по дуге в лунку; 5 лунок за 20 с, провал при 2 промахах. Кривые от `t` (скорость шкалы, разброс расстояний, узкая лунка, снос), бот, автотест."
      - title: "Мини-игра «Выстрой» (rings, файтинг)"
        types: [code]
        owner: claude
        size: M
        body: "По каталогу: три концентрических кольца с вырезами крутятся с разной скоростью, ␣ останавливает внешнее, среднее, внутреннее; 3 замка за 20 с. Кривые от `t` (скорость, узкие вырезы, обратное вращение), бот, автотест."
      - title: "Старт забега: «Новая студия», розыгрыш жанра, первый релиз"
        types: [code, ui]
        owner: claude
        size: M
        body: "По `specs/run.md`: экран «Новая студия» в большой карточке: выпавший жанр (не тот, что в прошлом забеге, из профиля), технология 8-bit (единственная в M2), бюджет, название студии из генератора, R перегенерирует. Первый релиз идёт на выпавшей паре, игрок выбирает только сеттинг на одной карусели. Название студии в шапке оболочки."
      - title: "Кап забега и сигналы капа"
        types: [code, design]
        owner: claude
        size: S
        body: "Кап разыгрывается на забег в 11-13 релизов (`run.tres`: `cap_min`, `cap_max`) и не показывается. Сигналы без студии (она в M5): с капа −3 критики пишут «студия-ветеран», с капа −2 реплики «сколько ещё» во вставках, на капе −1 приходит покупатель, если его не было. После фазы студии последнего релиза вместо конструктора «Итоги года»."
      - title: "Вставки: EventDef, ChoiceDef, CharacterDef и карточка персонажа"
        types: [code, ui]
        owner: claude
        size: L
        body: "По `specs/meta.md`: ресурсы вставок, вариантов и персонажей; карточка персонажа поверх студии в стиле оболочки: портрет (пиксельное лицо из ленты до M5), имя, роль, реплика, два-три варианта с пилюлями последствий (деньги, репутация стрелкой, ограничение, доля с хвоста, концовка). Мышь и клавиатура. Эффекты денег и репутации применяются сразу. Тестовая сцена с любой вставкой из меню."
      - title: "Планировщик вставок, настроения персонажей и шаг вставки в фазе студии"
        types: [code]
        owner: claude
        size: M
        body: "`EventState`: последняя вставка, показанные, настроения −1/0/+1, отказы издателю. Приоритеты: спасение, концовка, случайная (0 / 50 / 100 % по давности, с третьего релиза, одна за фазу). Настроение двигает числа на ±20 % и выбирает вариант реплики. Шаг 5 фазы студии между оценкой и предложением. Чистые функции с тестом на частоту за забег."
      - title: "Одиннадцать вставок v1: тексты, числа, условия"
        types: [design, code]
        owner: claude
        size: L
        body: "Таблица из `specs/meta.md`: оффер издателя, инвестор, интервью, фанаты просят сиквел, коллаб со стримером, скандал-клон, фестиваль, спасение, покупатель, корпорация, легенда. Тексты реплик в двух вариантах настроения, числа в `resources/meta.tres` (`MetaTuning`), условия как функции от `RunState`. Тест: каждая вставка выпадает при своём условии."
      - title: "Ограничения следующего релиза и доли с хвоста"
        types: [code]
        owner: claude
        size: M
        body: "Ограничение из вставки (жанр, сеттинг, технология, сиквел конкретной игры) лочит карусель конструктора на одной карточке с подписью «по договору с Виктором». Доли с хвоста: тик игры уменьшается на долю в ведомости фазы студии отдельной строкой, сумма долей с одной игры не больше 50 %. `GameRecord` хранит доли, `RunState` ограничения."
      - title: "Спасение издателя карточкой вместо строки"
        types: [code]
        owner: claude
        size: S
        body: "Банкротство в первый раз ведёт к вставке «Спасение» (аванс `rescue_amount`, следующая игра в жанре и сеттинге издателя, −30 % с её хвоста · продать лучший хвост · отказаться = банкротство) вместо строки «аванс издателя» из M1. Второе банкротство как в M1: конец забега."
      - title: "Концовки: условия, «Итоги года» и четыре экрана"
        types: [code, ui]
        owner: claude
        size: L
        body: "По `specs/run.md`: продажа (оценка студии), корпорация (тик × 10), легенда (три лучшие игры), банкротство (без оценки). «Итоги года» на капе: все выполненные концовки и продажа по умолчанию. Экран концовки: название, оценка крупно, три лучшие игры живыми встроенными демками, число релизов, кнопка в галерею. Пороги в `run.tres`."
      - title: "Профиль: записи всех забегов, лучшие концовки, последняя пара"
        types: [code]
        owner: claude
        size: M
        body: "`Profile` в `user://profile.tres`: галерея (запись игры с тройкой, оценками, багами, сидом, номером забега), лучшая оценка по каждой концовке, число забегов, последняя стартовая пара. Пишется по закрытию релиза и по концу забега, читается на старте. Версия формата и миграция пустым профилем."
      - title: "Экран галереи с запуском демок"
        types: [code, ui]
        owner: claude
        size: M
        body: "Галерея из главного меню и с экрана концовки: карточки игр всех забегов (тройка цветом, название, критики, баги штампами, номер забега), сортировка по забегам и по критикам, запуск демки с теми же сидом и багами, пустая галерея одной подписью. Мышь и клавиатура."
      - title: "Сохранение забега, три слота и главное меню"
        types: [code, ui]
        owner: claude
        size: L
        body: "Главное меню: три слота (студия, релиз, деньги или «пусто»), галерея, выход. `RunState` сериализуется в `user://slot_N.tres` на границах фаз и между спринтами; выход посреди мини-игры возвращает к началу спринта с новым сидом. Новый забег в занятом слоте с подтверждением. Пауза вне мини-игр (Esc): продолжить, в меню; настройки в M6."
      - title: "Модель забега M2 и сверка с реальным забегом"
        types: [design, code]
        owner: claude
        size: M
        body: "`tools/model_run.py` получает забег M2: одна технология 8-bit, покупка жанров и возможностей, кап 12, без вставок и с усреднёнными вставками. Бот проходит реальный забег в игре с фиксированными руками (q по спринтам) и пишет ведомость; тест сверяет деньги и хвосты с моделью с допуском. `economy_model.md` дополнен таблицей M2."
      - title: "Главный экран забега: студия, кнопка «Новая игра», окно денег"
        types: [code, ui]
        owner: claude
        size: L
        body: "Плейтест 2026-11-11, п. 1 и 5. Новый релиз начинается кнопкой, не сам. Главный экран забега: студия фоном (до пиксельной студии заглушка), слева сверху название и логотип, по центру снизу кнопка «Новая игра» (␣, клик), справа сверху пилюля денег. Клик или Tab по пилюле раскрывает мармеладом окно справа сверху: история денег по релизам (продажи, хвосты, доли, вставки, содержание, прокачка) плюсом и минусом. Фаза студии (расчёт, вставки, прокачка) идёт поверх этого экрана, после неё экран ждёт игрока. Пауза Esc здесь. История денег пишется в `RunState` и в сохранение слота."
      - title: "Главный экран забега: купленная прокачка и релизы"
        types: [code, ui]
        owner: claude
        size: L
        body: "Плейтест 2026-11-11, п. 5. На главном экране кнопка «Студия»: окно со всей купленной прокачкой в порядке покупки (релиз покупки, цвет вида). Сбоку лента карточек релизов этого забега (тройка цветом, название, критики); клик или ␣ выдвигает на полэкрана поверх студии панель релиза: отзывы этого релиза (лента по записи), оценки и деньги, кнопка «Играть демку» с теми же сидом и багами."
      - title: "Цвета видов прокачки: жанры, технологии, возможности"
        types: [ui]
        owner: claude
        size: S
        body: "Плейтест 2026-11-11, п. 6. У каждого вида прокачки свой цвет (жанр, технология, сеттинг, возможность студии): полоса или пилюля вида на карточке предложения в фазе студии и в списке купленного на главном экране. Токены в `STYLE.md` и `Style`, смысловые цвета не трогаем."
      - title: "Пиксельная студия на фоне главного экрана"
        types: [art, code]
        owner: claude
        size: L
        body: "Перенесено из M5 2026-11-11 (плейтест, п. 11). По GDD: студия пиксельная, одноцветная, в три четверти, заполняет фон под оболочкой и растёт с прокачкой (новые столы, техника, предметы на купленные возможности). Сотрудники: маленькие безликие чубрики с простой анимацией, копошатся. Генератор `tools/pixel_sprites.py` или сцена из тайлов, слои по прокачке, превью-лист; фон главного экрана забега, фазы студии и пауз между спринтами."
      - title: "Экран настроек"
        types: [code, ui]
        owner: claude
        size: M
        body: "Перенесено из M6 2026-11-11 (плейтест, п. 11). Из главного меню и из паузы: громкость (общая, музыка, звуки), окно или полный экран, движение мармелада вкл/выкл, язык подписей клавиш (клавиатура или геймпад, авто). `user://settings.cfg`, применяется сразу. Мышь и клавиатура."
      - title: "Мышь в оболочке целиком: колесо и тачпад, фокус наведением"
        types: [code, ui]
        owner: claude
        size: M
        body: "Плейтест 2026-11-11, п. 3; отменяет «ховера нет» из плейтеста M1. Наведение переносит фокус (тот же тёмный подъём, что от стрелок) на всех кнопках, карточках и строках. Колесо и прокрутка тачпада (`InputEventPanGesture` и дробный `factor`) листают все списки и карусели: отзывы в ленте, карточки конструктора, галерея, история денег, купленная прокачка. Клик работает везде, включая «В разработку» в карточке «Следующая игра» (сейчас не нажимается). Проверка обходом всех экранов: нет места, где нужна клавиатура."
      - title: "Мышь в мини-играх"
        types: [code, design]
        owner: claude
        size: L
        body: "Плейтест 2026-11-11, п. 3; отменяет «мини-игры остаются клавиатурными». Клавиатура остаётся основной, мышь естественная для каждой игры: левый клик = ␣, правый = Ctrl; где есть цель (Бей, Наведи, Натяни, Подгони), курсор работает напрямую; где направление (Выведи, Реши, Прыгай), клик по стороне поля или жест. Таблица всех двадцати в `minigames_catalog.md` до кода, на утверждение. Пилюля ввода показывает мышь, когда игрок ею пользуется."
      - title: "Вёрстка: подбородок карточек конструктора, пилюли галереи"
        types: [ui]
        owner: claude
        size: S
        body: "Плейтест 2026-11-11, п. 2 и 7. У карточек экрана «Следующая игра» подбородок выше примерно на 20 px. Нижние пилюли подсказок галереи (выбрать, запустить, сортировка, назад) наезжают друг на друга: одна строка с промежутками или перенос."
      - title: "Текстовки оболочки: дерзче, смешнее, без лобовых объяснений"
        types: [design]
        owner: claude
        size: M
        body: "Плейтест 2026-11-11, п. 8. Пройти все строки оболочки (меню, слоты, «Новая студия», конструктор, фаза студии, пауза, концовки, галерея, пустые состояния, подсказки): меньше объяснений в лоб, больше характера, со вкусом и без перебора. Пример: подзаголовок главного меню. Подписи клавиш остаются точными. Тексты в ресурсы, если ещё в коде. Список было → стало на утверждение до правки."
      - title: "Мини-игры: условия «Реши» словами, гладкий след в «Выведи»"
        types: [code]
        owner: claude
        size: S
        body: "Плейтест 2026-11-11, п. 9 и 10. «Реши»: вместо «2n» и «2n+1» «чётное» и «нечётное», цвет словом («красное») вместо цветного круга, остальные условия так же явно. «Выведи»: след точки скруглённый на поворотах и непрерывный, куски не накладываются друг на друга (одна полилиния вместо кусков)."
      - title: "Плейтест M2: полный забег"
        types: [design]
        owner: artemii
        size: S
        body: "Сыграть забег от «Новой студии» до концовки. Вопросы вехи: держит ли забег 1-2 часа, разные ли пять жанров на ощупь, приходят ли вставки к месту и меняют ли решения, понятна ли концовка, хочется ли второй забег. Замечания в issues, решения в журнал."
  - id: M3
    title: "M3 Двумерные технологии"
    goal: "Вектор и 16/32-bit для всех жанров: десять демок, технологические мини-игры, псевдо-3D гонки, Doom-шутер, форматы ассетов трёх сеттингов под обе технологии. Вектор заменил ASCII 2026-11-11 (плейтест #90)."
    done_when: "Забег с тремя технологиями, выбор технологии ощущается как разная игра."
    status: done
    issues:
      - title: "Векторная основа демок: луч, контуры слотов, послесвечение, общие баги"
        types: [code, vfx]
        owner: claude
        size: L
        body: "Пивот 2026-11-11: вектор вместо ASCII (решение в `DESIGN.md`). Основа пяти векторных демок по `demos_catalog.md`: слой рисования линиями со свечением и послесвечением люминофора на чёрном, один-два цвета луча на сеттинг. Контуры слотов снимаются автоматически с силуэтов 8-bit спрайтов трёх сеттингов и упрощаются; своя форма слота в ресурсе сеттинга, если контур не читается. Звук пищалкой (`Sfx.beep`, `Sfx.beeper_loop` уже есть). Общие баги `Demo` в векторном виде: розовая заглушка розовым контуром-крестом, чужая палитра на всём слое, фризы, заикание и запоздалый ввод через хуки. Лист контуров трёх сеттингов в `debug/playtest/`, тестовая сцена, ручки в дебаг-меню. ASCII-основа удалена."
      - title: "Баг технологии вектора «луч не успевает»"
        types: [code]
        owner: claude
        size: S
        body: "Мини-игра «Разгони» (mash) сделана в #89 и остаётся за вектором в прежнем виде: все мини-игры в одной стилистике оболочки, образ технологии в светящиеся линии не переводится (решение 2026-11-11). Баг технологии `beam_lag`: луч не успевает, при множестве линий картинка мерцает, линии дрожат и двоятся, концы не сходятся (`BugDef`, твит и кадр клипа под пять жанров), работает в любой векторной демке через основу."
      - title: "Демка платформер × вектор"
        types: [code]
        owner: claude
        size: L
        body: "«Этажи с дырами» (решение 2026-11-11: не физика платформера 8-bit, а геймплей попроще и под технологию). Один экран без прокрутки, замкнутый по краям: земля и шесть линий-этажей, по линиям едут дыры, по этажам ходят враги, флаг на верхнем. Влево, вправо бег, ␣ прыжок: под дырой подъём на этаж, без дыры удар о потолок и оглушение; враг оглушает; дыра под ногами роняет на этаж ниже и стоит жизни, жизней три. Уровень из сида (скорости и направления дыр, враги, монеты). Жанровый и балансные баги, бот WIN и LOSE, `demo_test --tech=vector`, стрим ленты."
      - title: "Демка гонки × вектор"
        types: [code]
        owner: claude
        size: L
        body: "«Полосы» (решение 2026-11-11: не машина с инерцией и заносом, а геймплей попроще и под технологию). Вид сверху, дорога из четырёх полос едет навстречу, машина внизу экрана. Влево, вправо перестроение на соседнюю полосу одним шагом, ␣ газ. Объезжаешь препятствия и обгоняешь трёх соперников, столкновение сбрасывает скорость; финиш через дистанцию, цель прийти первым. Заезд из сида (расстановка препятствий, темп соперников). Баги: гололёд проскальзывает лишнюю полосу, «сквозь стены» пускает по обочине за краем дороги, балансные; правила и боты без окна, бот WIN и LOSE, `demo_test --genre=racing --tech=vector`, стрим ленты."
      - title: "Демка шутер × вектор"
        types: [code]
        owner: claude
        size: L
        body: "«Башня в центре» (решение 2026-11-12: не корабль с тягой и инерцией, а геймплей попроще и под технологию). Пушка стоит в центре экрана и не ездит: влево, вправо поворот ствола, ␣ выстрел. Со всех сторон к ней летят враги и глыбы, глыба от выстрела раскалывается на две мелкие; долетел до центра: минус жизнь, жизней три. Цель: уничтожить 30. Волны из сида (откуда, когда и с какой скоростью летят). Баги: лёд крутит ствол после отпускания, «сквозь врагов» пропускает выстрел через раз, балансные; правила и боты без окна, бот WIN и LOSE, `demo_test --genre=shooter --tech=vector`, стрим ленты."
      - title: "Демка спорт × вектор: понг"
        types: [code]
        owner: claude
        size: M
        body: "Понг против ИИ: ракетки и мяч линиями, хвост послесвечения у мяча, счёт сверху, матч до пяти очков (таймера у демок нет); вверх, вниз. Соперник из сида. Баг «мяч залипает в стене и улетает за край», балансные (ИИ непробиваемый или рассыпается от касания), правила и боты без окна, бот WIN и LOSE."
      - title: "Демка файтинг × вектор: дуэль на реакцию"
        types: [code]
        owner: claude
        size: M
        body: "Два бойца контурами, пауза случайной длины, вспышка `!`, кто первым нажал ␣, тот бьёт, проигравший рассыпается на отрезки; нажал до вспышки, проиграл раунд. Пять раундов, кто взял больше; соперник от раунда к раунду бьёт всё раньше. Баг «удары не регистрируются», балансные, правила и боты без окна, бот WIN и LOSE."
      - title: "16/32-рендер демок: спрайты 32×32, 16 цветов, параллакс, трекер"
        types: [code]
        owner: claude
        size: L
        body: "Основа 16/32-демок. Общего рендера на пять демок нет (решение 2026-11-12): общие пиксельный экран ×2, палитра сеттинга из 16 цветов, ленты кадров 32×32 (боец 32×64) до 6 кадров, трекер на 8 голосов и общие баги `Demo` в 16/32-виде; поверх них два вида: сбоку с параллаксом в три слоя и из-за спины вглубь экрана. Спрайты рисуются заново, стартовый набор пиратов для пробных демок здесь, полный в следующей задаче. Формат ресурса так, чтобы космос и замки подключались одной папкой и палитрой."
      - title: "Спрайты 16/32 пиратов для пяти демок"
        types: [art, code]
        owner: claude
        size: L
        body: "`tools/pixel_sprites16.py` (генератор из #95, рисунок примитивами с автотенью и обводкой): все ленты пяти 16/32-демок у пиратов по геймплею, который для каждой демки выбирается отдельно: герой, враги, бойцы 32×64, транспорт, мяч, ворота, слои параллакса. Делается вместе с демками или сразу перед ними. Космос и замки до M5 берут пиратов, как было с 8-bit. Превью-лист."
      - title: "Мини-игра «Поставь» (stack, 16/32-bit) и баг технологии 16/32"
        types: [code]
        owner: claude
        size: M
        body: "Заглушка `stack` становится мини-игрой: блок ездит над башней, ␣ роняет, свесившееся отрезается, 8 этажей, с `t` смена направления на лету; мармелад и мышь. Провал даёт баг технологии 16/32 во всех 16/32-демках: слои параллакса едут в разные стороны, разрывы. Бот WIN и LOSE."
      - title: "Демка платформер × 16/32-bit"
        types: [code]
        owner: claude
        size: XL
        body: "«Тропа» (решение 2026-11-12, после плейтеста «по клеткам»): вид сбоку крупным планом, лес без неба в три слоя и листва над кадром, детальный передний план по композиции референса. Бег с инерцией по ровной земле и склонам двух наклонов, ␣ прыжок, Ctrl слайд (под арками из корней и под попугаями), лианы над широкими ямами. Краб и попугай угроза, убить нельзя. Три жизни, вода в ямах, возврат на место отдыха, флаг справа. Уровень из сида. Баги: прыжок ×3 и враги быстрее, монеты не достать, чих роняет врага; правила и боты без окна, бот WIN и LOSE, `demo_test --tech=bit16`, стрим ленты."
      - title: "Демка гонки × 16/32-bit: псевдо-3D"
        types: [code]
        owner: claude
        size: XL
        body: "По мотивам Horizon Chase Turbo (решение 2026-11-12): псевдо-3D, дорога сегментами к горизонту, повороты и холмы, соперники и пропы масштабируемыми спрайтами. Старт последним из 12, цель: финиш в тройке. ␣ газ, Ctrl нитро (три заряда), монеты на дороге. У пиратов повозки по прибрежной дороге. Трасса из сида, правила и боты без окна, бот WIN и LOSE, дамп трассы, стрим ленты."
      - title: "Демка шутер × 16/32-bit: рейкастинг"
        types: [code]
        owner: claude
        size: XL
        body: "«До выхода» (решение 2026-11-12), графика по Doom: вид от первого лица на рейкастинге, текстуры на стенах, полу и потолке, свет темнеет с расстоянием, оружие в руке, лицо героя в HUD; спрайтовые враги в нескольких ракурсах. Комнаты и коридоры из сида, враги идут и стреляют, аптечки, ключ от двери выхода; вверх, вниз ход, влево, вправо поворот, ␣ выстрел, Ctrl стрейф при зажатии. Правила и боты без окна по графу комнат, дамп карты, стрим ленты."
      - title: "Демка спорт × 16/32-bit: футбол один на один"
        types: [code]
        owner: claude
        size: XL
        body: "Один на одного (решение 2026-11-12), графика по Sensible Soccer: вид сверху, крошечные игроки в восьми направлениях, мяч с высотой и тенью, камера за мячом; вратари-боты. Мяч липнет к ноге, удар с зарядкой по длине нажатия, подкат; матч до трёх голов; стрелки, ␣ удар, Ctrl подкат. Соперник по плану из сида, правила и боты без окна, бот WIN и LOSE, дамп, стрим ленты."
      - title: "Демка файтинг × 16/32-bit: битемап"
        types: [code]
        owner: claude
        size: XL
        body: "Битемап (решение 2026-11-12), графика по Streets of Rage 2: портовый городок с глубиной, три экрана, экран встаёт, пока не побиты враги; враги по двое-трое, на третьем мини-босс; комбо из трёх ударов, бросок, прыжок с ударом, полоски здоровья с именем; жизни; стрелки в 8 направлениях, ␣ удар, Ctrl прыжок. Волны из сида, правила и боты без окна, бот WIN и LOSE, дамп, стрим ленты."
      - title: "Баги в 16/32-демках: жанровые и балансные"
        types: [code, design]
        owner: claude
        size: L
        body: "Жанровый баг и балансные проявления в каждой из пяти 16/32-демок (прыжок выше экрана, машина сквозь отбойник, сквозь стены в рейкастере, мяч в космос, хитбоксы битемапа), видно в первые 15 секунд, твиты и кадры клипов. Общие и технологический баги уже работают из основы. `demo_test --bugs` по всем десяти новым парам."
      - title: "Три технологии в забеге: прокачка, старт, ремейки, предметы студии"
        types: [code]
        owner: claude
        size: M
        body: "Вектор и 16/32-bit как `UpgradeDef` вида TECH (цены и содержание из `economy.tres`), новая карточка в карусели технологий, своя мини-игра в плане релиза. Случайный старт из трёх технологий. Ремейки в пуле, раз технологий больше одной: проверить поток ремейка в конструкторе, ленте и галерее. Предметы студии: векторный автомат (сейчас на его месте нарисован терминал), 16/32 монитор с колонками. Закрытые пары в конструкторе исчезают."
      - title: "Модель забега M3 и баланс трёх технологий"
        types: [design, code]
        owner: claude
        size: M
        body: "`model_run.py --m3`: забег с тремя технологиями, хорошие и средние руки, ниши вектора (критики, дёшево) и 16/32 (продажи, дорого). Ответ на вопросы #72: выживают ли средние руки с дешёвой технологией, растёт ли студия у хороших рук после девятого релиза. Предложение тюнинга на утверждение, затем сверка ведомостью (`--ledger`) на трёх технологиях."
      - title: "Плейтест M3: технологии как разные игры"
        types: [design]
        owner: artemii
        size: S
        body: "Забег с тремя технологиями. Вопросы вехи: ощущается ли выбор технологии как разная игра, читаются ли векторные демки и держит ли их тайминг, держится ли псевдо-3D и рейкастер на минуту, есть ли смысл возвращаться к дешёвой технологии, нужны ли ремейки. Замечания в issues, решения в журнал."
